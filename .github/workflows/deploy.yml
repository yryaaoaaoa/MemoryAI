name: Deploy MemoryAI

on:
  push:
    branches: [master]
    paths:
      - 'ai-rag-agent/**'
      - 'ai-job-prep-frontend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memoryai-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'ai-rag-agent/**/pom.xml'

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.10.0

      - name: Test and package backend
        working-directory: ai-rag-agent
        run: mvn -B -ntp clean verify

      - name: Test and build frontend
        working-directory: ai-job-prep-frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Test deployment rollback
        run: python3 -m unittest discover -s deploy/tests -v

      - name: Package release
        id: release
        run: |
          bash deploy/docker/package.sh "$RUNNER_TEMP/memoryai.tar.gz"
          printf 'tag=%s-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$(sha256sum "$RUNNER_TEMP/memoryai.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Save release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memoryai-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/memoryai.tar.gz
          retention-days: 7

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_CHECKSUM: ${{ steps.release.outputs.checksum }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/memoryai"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/memoryai" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/memoryai"' EXIT
          target="$DEPLOY_USER@$DEPLOY_HOST"
          options=(-i "$HOME/.ssh/memoryai" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          scp "${options[@]}" "$RUNNER_TEMP/memoryai.tar.gz" "$target:/opt/memoryai/incoming/$RELEASE_TAG.tar.gz"
          scp "${options[@]}" deploy/docker/deploy.sh "$target:/opt/memoryai/incoming/$RELEASE_TAG.sh"
          ssh "${options[@]}" "$target" "bash '/opt/memoryai/incoming/$RELEASE_TAG.sh' '$RELEASE_TAG' '$RELEASE_CHECKSUM'"
          printf '### Published\n\nCommit: `%s`\n\n[Open MemoryAI](http://%s/)\n' "$GITHUB_SHA" "$DEPLOY_HOST" >> "$GITHUB_STEP_SUMMARY"
