name: memoryai

services:
  mysql:
    image: mysql:8.0.41
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: memoryai
      MYSQL_USER: memoryai
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=256M"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -u\"$$MYSQL_USER\" -D memoryai -Nse 'SELECT 1 FROM learning_note LIMIT 0'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASS: ${REDIS_PASS:?Set REDIS_PASS}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASS\""]
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASS\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.17.10
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  es-init:
    image: elasticsearch:8.17.10
    restart: "no"
    entrypoint: ["sh", "/init/es-init.sh"]
    volumes:
      - ./es-init.sh:/init/es-init.sh:ro
      - ./es-index.json:/init/es-index.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  backend:
    image: memoryai-backend:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
      DB_PASS: ${DB_PASS}
      REDIS_PASS: ${REDIS_PASS}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?Set SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      OCR_PADDLE_URL: ${OCR_PADDLE_URL:-}
      OCR_PADDLE_TOKEN: ${OCR_PADDLE_TOKEN:-}
    volumes:
      - ./application.yml:/app/config/application.yml:ro
    mem_limit: 1280m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/knowledge-bases/public"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    image: memoryai-web:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80"
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  es-data:
